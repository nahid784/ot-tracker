<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OT Tracker | Nahid Hasan</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-clock"></i> OT Tracker</h1>
      <p>Automated Overtime Calculator</p>
    </header>

    <div class="controls">
      <div class="input-group">
        <label>Basic Salary (Taka)</label>
        <input type="number" id="basic" value="10000">
      </div>
      
      <div class="upload-area" id="uploadArea">
        <i class="fas fa-cloud-upload-alt"></i>
        <p>Upload Attendance Excel File</p>
        <input type="file" id="fileInput" accept=".xlsx, .xls" hidden>
      </div>
    </div>

    <div id="result" class="result"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
